apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: careertrack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Sachinrh18/Careertrack-GitOps.git
    targetRevision: main
    path: helm/careertrack

  destination:
    server: https://kubernetes.default.svc
    namespace: careertrack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true