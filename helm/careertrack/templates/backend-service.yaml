apiVersion: v1
kind: Service
metadata:
  name: careertrack-backend
  namespace: {{ .Values.namespace }}

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: careertrack-backend

  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP