# General configuration
namespace: careertrack

# Backend configuration
backend:
  replicaCount: 1

  image:
    repository: sachinrh18/careertrack-backend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Frontend configuration
frontend:
  replicaCount: 1

  image:
    repository: sachinrh18/careertrack-frontend
    tag: "ebb33b52684cd86725ad1bf7d9309b8767fcfc83"
    pullPolicy: Always

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# MySQL configuration
mysql:
  image:
    repository: mysql
    tag: "8.0"

  database: careertrack

  storage:
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
